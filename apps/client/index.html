<!doctype html>
<!-- `data-fui-theme` is what the FantasyUIs theme binds to: without it every art
     slot is unset and the components render as unpainted boxes. Set here rather
     than from JavaScript so the first paint is already themed. -->
<html lang="en" data-fui-theme="dark-ember">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS reads the icon off the page rather than out of the manifest. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mistvale" />
    <meta
      name="description"
      content="Mistvale — collect champions through the Mistgate and reclaim a mist-drowned realm."
    />
    <title>Mistvale</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Mistvale needs JavaScript enabled to play.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
