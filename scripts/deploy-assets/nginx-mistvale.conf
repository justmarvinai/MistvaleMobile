# =============================================================================
# nginx-mistvale.conf — the single Mistvale site (play.pathlands.cc)
# =============================================================================
# Rendered by scripts/DEPLOY.sh into /etc/nginx/sites-available/mistvale and
# symlinked into sites-enabled/. The __TOKEN__ placeholders are substituted from
# the constants in scripts/lib/common.sh:
#
#   __DOMAIN__        = play.pathlands.cc     __APP_ROOT__ = /srv/mistvale
#   __UPLOADS__       = /var/lib/mistvale/uploads
#   __HOST__:__PORT__ = 127.0.0.1:3001
#
# Routing (DEPLOYMENT_OPERATIONS.md §1) — nginx selects the LONGEST matching
# prefix location, so /admin/api wins over /admin no matter the file order:
#
#   /admin/api  → proxy to the Fastify admin API (rank-gated server-side)
#   /admin      → static admin SPA, SPA fallback to /admin/index.html
#   /api        → proxy to the Fastify player API (no-store)
#   /assets /atlases /uploads → immutable caching for content-hashed files
#   /           → static game SPA, SPA fallback to /index.html
#
# certbot --nginx edits THIS file in place to add the TLS server block. DEPLOY.sh
# refuses to overwrite a certbot-managed file unless --force-nginx is passed (and
# then re-runs certbot in the same run so TLS comes straight back).
#
# nginx gotcha worth knowing before editing: `add_header` directives are NOT
# inherited into a location that declares any `add_header` of its own. That is
# why the security headers are repeated in the locations below instead of being
# declared once at server level.
# -----------------------------------------------------------------------------

# --- Rate-limit + connection zones (http context) ----------------------------
# nginx is only the coarse outer net; the authoritative per-account limits live
# in the server (ARCHITECTURE §5.2, configurable in game_config).
# Login/register are the abuse-prone endpoints, hence their own tighter zone.
limit_req_zone  $binary_remote_addr  zone=mistvale_auth:1m   rate=20r/m;
limit_req_zone  $binary_remote_addr  zone=mistvale_api:5m    rate=30r/s;
limit_req_zone  $binary_remote_addr  zone=mistvale_admin:1m  rate=10r/s;
limit_conn_zone $binary_remote_addr  zone=mistvale_conn:5m;
limit_req_status 429;
limit_conn_status 429;

# One Node process upstream; keepalive reuse saves a slice of the single core.
upstream mistvale_app {
    server __HOST__:__PORT__;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # HTTP/2 is enabled by DEPLOY.sh in a version-aware way, because the syntax
    # changed mid-stream and Ubuntu 24.04 still ships nginx 1.24:
    #   nginx >= 1.25.1 → snippets/mistvale-http2.conf holding `http2 on;`
    #   nginx <  1.25.1 → `http2` appended to certbot's `listen 443 ssl` line
    # The wildcard include matches nothing when the snippet is absent.
    include /etc/nginx/snippets/mistvale-http2*.conf;

    root __APP_ROOT__/client;
    index index.html;

    charset utf-8;
    server_tokens off;
    # Relative Location headers: nginx's automatic "/admin" → "/admin/" redirect
    # then cannot guess the wrong scheme or host behind TLS.
    absolute_redirect off;

    # Admin asset uploads (frame strips / PNGs) — API_DESIGN §2 assets.
    client_max_body_size 20M;
    client_body_timeout 30s;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        application/javascript application/json application/manifest+json
        application/wasm application/xml image/svg+xml
        text/css text/javascript text/plain text/xml;
    gzip_static on;   # serves *.gz siblings when the build ever emits them

    # Brotli is optional: its directives only parse when
    # libnginx-mod-http-brotli is installed. DEPLOY.sh writes the snippet only in
    # that case — a wildcard include silently matches nothing otherwise, which is
    # the only "module may be absent" guard nginx offers.
    include /etc/nginx/snippets/mistvale-brotli*.conf;

    # --- Default security headers (documents + SPA fallback) -----------------
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "DENY" always;
    add_header Referrer-Policy          "no-referrer" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Ignored by browsers over plain HTTP; active as soon as certbot adds TLS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP for a self-contained SPA: no CDNs, no inline scripts (Vite emits
    # external bundles); blob:/data: for Pixi textures and Howler audio decoding;
    # 'unsafe-inline' in style-src covers React/Mantine inline style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # --- Health probe (public, cheap; UptimeRobot target) --------------------
    location = /api/health-lite {
        access_log off;

        proxy_pass http://mistvale_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-store" always;
    }

    # --- Auth endpoints: tighter rate limit ----------------------------------
    location ^~ /api/auth/ {
        limit_req zone=mistvale_auth burst=10 nodelay;
        limit_conn mistvale_conn 20;

        proxy_pass http://mistvale_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-store" always;
    }

    # --- Admin API (proxied; the server re-checks rank=admin on every request) -
    location ^~ /admin/api/ {
        # Optional IP allowlist (USER_QUESTIONS O1). DEPLOY.sh generates
        # /etc/nginx/snippets/mistvale-admin-allowlist.conf when ADMIN_ALLOWLIST
        # is set in /srv/mistvale/.env, containing e.g.
        #     allow 203.0.113.7;
        #     allow 198.51.100.0/24;
        #     deny all;
        # "No snippet" therefore means "no IP restriction" (the default).
        include /etc/nginx/snippets/mistvale-admin-allowlist*.conf;

        limit_req zone=mistvale_admin burst=20 nodelay;
        limit_conn mistvale_conn 20;

        proxy_pass http://mistvale_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Content publish / import / atlas packing can take a while on 1 core.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-store" always;
    }

    # --- Player API ----------------------------------------------------------
    location ^~ /api/ {
        limit_req zone=mistvale_api burst=40 nodelay;
        limit_conn mistvale_conn 40;

        proxy_pass http://mistvale_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # API responses are never cached: every mutation returns authoritative
        # state, and the content bundle is revalidated by ETag.
        add_header Cache-Control "no-store" always;
    }

    # --- Admin SPA (static, Vite base '/admin/') -----------------------------
    # `root __APP_ROOT__` (not `alias`) maps /admin/... → /srv/mistvale/admin/...
    # and keeps try_files' SPA fallback free of the classic alias pitfalls.
    location ^~ /admin/assets/ {
        root __APP_ROOT__;
        access_log off;
        try_files $uri =404;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /admin {
        include /etc/nginx/snippets/mistvale-admin-allowlist*.conf;

        root __APP_ROOT__;
        try_files $uri $uri/ /admin/index.html;

        # The SPA shell must never be cached — it references hashed assets.
        location = /admin/index.html {
            root __APP_ROOT__;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            add_header Cache-Control "no-store, must-revalidate" always;
        }
    }

    # --- Immutable static content -------------------------------------------
    # Vite emits content-hashed files into dist/assets; tools/atlas-pack emits
    # dist/atlases (ARCHITECTURE §4.5). Both are safe to cache forever.
    location ^~ /assets/ {
        access_log off;
        try_files $uri =404;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /atlases/ {
        access_log off;
        try_files $uri =404;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Admin-uploaded art, served straight off disk (never through Node).
    # Upload filenames are content-hashed by the asset pipeline.
    location ^~ /uploads/ {
        alias __UPLOADS__/;
        access_log off;
        try_files $uri =404;
        # Uploads are art only: never sniff, never execute, always download-safe.
        default_type application/octet-stream;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Fonts + audio shipped with the client build (unhashed public/ files).
    location ~* \.(?:woff2?|ttf|otf|mp3|ogg|wav)$ {
        access_log off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # --- Game SPA ------------------------------------------------------------
    # The shell and the service worker must always be revalidated so a deploy is
    # picked up on the next load (see X-Client-Rev / 426 flow, ARCHITECTURE §7).
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location = /sw.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hide dotfiles (e.g. a stray .env that ends up inside a build directory).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ACME http-01 challenge — certbot --nginx handles this itself, but an
    # explicit webroot location keeps `certbot renew --webroot` usable too.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        default_type "text/plain";
    }

    access_log /var/log/nginx/mistvale.access.log;
    error_log  /var/log/nginx/mistvale.error.log warn;
}
