# =============================================================================
# postgres-mistvale.conf — PostgreSQL 16 tuning for the 1-core / 4 GB VPS
# =============================================================================
# Installed by scripts/DEPLOY.sh as
#   /etc/postgresql/16/main/conf.d/mistvale.conf
# which Debian/Ubuntu's postgresql.conf pulls in via `include_dir = 'conf.d'`
# (DEPLOY.sh appends that line if the distro package ever drops it).
#
# Numbers come straight from ARCHITECTURE.md §9 and
# DEPLOYMENT_OPERATIONS.md §3 — the RAM budget is:
#   Postgres ≤ 768 MB · Node ≤ 1.2 GB · nginx + OS = remainder (of 4 GB).
#
# Worst-case working memory:
#   shared_buffers 256 MB + max_connections 20 × work_mem 8 MB = 416 MB,
#   leaving headroom for maintenance work and the OS page cache.
#
# Apply with:  systemctl restart postgresql   (shared_buffers/max_connections
# need a restart; the rest would reload).
# -----------------------------------------------------------------------------

# --- Connectivity ------------------------------------------------------------
# Everything except nginx binds loopback only (DEPLOYMENT_OPERATIONS §1).
listen_addresses = 'localhost'
port = 5432
# The server pool is capped at 10 (ARCHITECTURE §5/§9); the rest is headroom for
# psql, pg_dump, migrations and the ops scripts.
max_connections = 20
superuser_reserved_connections = 3
password_encryption = 'scram-sha-256'

# --- Memory ------------------------------------------------------------------
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 64MB
# Small, hot schema: a generous relation cache avoids repeated catalog lookups.
temp_buffers = 8MB

# --- Planner (SSD-backed VPS) ------------------------------------------------
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 200
default_statistics_target = 100
# One core: parallel query only steals time from the game server.
max_parallel_workers_per_gather = 0
max_parallel_workers = 1
max_parallel_maintenance_workers = 0
max_worker_processes = 4
# The workload is many tiny OLTP statements; LLVM JIT compilation would cost
# more than it saves.
jit = off

# --- WAL / checkpoints -------------------------------------------------------
wal_compression = on
wal_level = replica
max_wal_size = 1GB
min_wal_size = 128MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
# Full page writes stay ON (default): the VPS can lose power at any time.

# --- Autovacuum --------------------------------------------------------------
# Defaults per DEPLOYMENT_OPERATIONS §3, with a slightly more eager naptime
# because battles/economy_log churn constantly and the tables stay small.
autovacuum = on
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
# Never let vacuum starve the single core.
autovacuum_max_workers = 2
autovacuum_vacuum_cost_delay = 10ms

# --- Timeouts (protect the single core from a runaway query) ------------------
# 60s is ~600× the p95 API budget, so it only ever fires on a genuine runaway.
# Long-running maintenance overrides it explicitly:
#   • BACKUP.sh / RESTORE.sh export PGOPTIONS='-c statement_timeout=0'
#   • a migration that legitimately needs longer must open with
#     `SET statement_timeout = 0;` (drizzle migrations are plain SQL files)
statement_timeout = 60s
lock_timeout = 10s
idle_in_transaction_session_timeout = 60s

# --- Logging -----------------------------------------------------------------
# Slow-query visibility without log spam; STATUS.sh/LOGS.sh read the app logs,
# these land in /var/log/postgresql/.
log_min_duration_statement = 500        # ms
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 1024                   # kB — surfaces work_mem being too small
log_autovacuum_min_duration = 10s

# --- Locale / time -----------------------------------------------------------
# All timestamps in the API are UTC ISO-8601 (API_DESIGN §3); the daily-reset
# timezone is a game_config value, never a database setting.
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'

# --- Extensions --------------------------------------------------------------
# citext is used for account_name / profile_name uniqueness (DATA_MODEL §4); it
# is a plain extension, no preload required. pg_stat_statements is cheap and
# invaluable when the p95 budget slips — enable it here rather than debugging
# blind later.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 1000
pg_stat_statements.track = top
